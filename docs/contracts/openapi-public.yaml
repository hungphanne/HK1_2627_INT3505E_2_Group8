openapi: 3.0.3
info:
  title: HotelGenie Public API
  version: 1.0.0
  description: Hợp đồng thiết kế v1.0 (draft). API công khai qua gateway; chưa triển khai.
servers:
- url: http://localhost:8080
  description: Gateway demo (đề xuất; kiểm chứng khi Compose có thật)
- url: http://127.0.0.1:4010
  description: Prism mock server – demo tuần 12 (docs/08-development-testing.md)
tags:
- name: Auth
- name: Hotels
- name: Bookings
- name: Reviews
- name: AI
paths:
  /api/v1/auth/register:
    post:
      tags:
      - Auth
      operationId: registerUser
      summary: Đăng ký tài khoản
      responses:
        '201':
          description: Thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
              example:
                id: 30000000-0000-4000-8000-000000000001
                email: an@example.com
                full_name: Nguyễn Văn An
                role: customer
        '400':
          description: Dữ liệu không hợp lệ
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '409':
          description: Email đã được đăng ký
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              example:
                type: https://hotelgenie.local/problems/email-already-exists
                title: Conflict
                status: 409
                detail: Email an@example.com đã được đăng ký.
                instance: /api/v1/auth/register
                code: EMAIL_ALREADY_EXISTS
                request_id: req-auth-0001
        '422':
          description: Vi phạm ràng buộc dữ liệu
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '500':
          description: Lỗi máy chủ
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
            example:
              email: an@example.com
              password: matkhau123
              full_name: Nguyễn Văn An
  /api/v1/auth/token:
    post:
      tags:
      - Auth
      operationId: issueToken
      summary: Đăng nhập, nhận JWT
      responses:
        '200':
          description: Thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
              example:
                access_token: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.demo.signature
                token_type: Bearer
                expires_in: 3600
        '400':
          description: Dữ liệu không hợp lệ
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '401':
          description: Sai email hoặc mật khẩu
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              example:
                type: https://hotelgenie.local/problems/invalid-credentials
                title: Unauthorized
                status: 401
                detail: Email hoặc mật khẩu không đúng.
                instance: /api/v1/auth/token
                code: INVALID_CREDENTIALS
                request_id: req-auth-0002
        '500':
          description: Lỗi máy chủ
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenRequest'
            example:
              email: an@example.com
              password: matkhau123
  /api/v1/users/me:
    get:
      tags:
      - Auth
      operationId: getCurrentUser
      summary: Hồ sơ người dùng hiện tại
      responses:
        '200':
          description: Thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
              example:
                id: 30000000-0000-4000-8000-000000000001
                email: an@example.com
                full_name: Nguyễn Văn An
                role: customer
        '401':
          description: Chưa xác thực
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '500':
          description: Lỗi máy chủ
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
      security:
      - bearerAuth: []
  /api/v1/hotels:
    get:
      tags:
      - Hotels
      operationId: listHotels
      summary: Danh sách khách sạn; có thể lọc theo khả dụng
      responses:
        '200':
          description: Thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HotelList'
              example:
                data:
                - id: 10000000-0000-4000-8000-000000000002
                  name: HotelGenie Đà Nẵng Demo
                  city: Đà Nẵng
                  address: Hải Châu, Đà Nẵng, Việt Nam
                  latitude: 16.0614
                  longitude: 108.224
                  description: Dữ liệu minh họa, không phải khách sạn thật
                pagination:
                  page: 1
                  per_page: 20
                  total: 1
                  total_pages: 1
        '400':
          description: Dữ liệu không hợp lệ
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              example:
                type: about:blank
                title: Bad Request
                status: 400
                detail: Tham số phân trang không hợp lệ
                code: VALIDATION_ERROR
                request_id: req-demo-400
                errors:
                - field: per_page
                  message: per_page phải nằm trong khoảng từ 1 đến 100
        '422':
          description: Vi phạm ràng buộc dữ liệu
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '503':
          description: Dịch vụ chưa sẵn sàng
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '500':
          description: Lỗi máy chủ
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
      parameters:
      - name: city
        in: query
        required: false
        description: Tên thành phố, không phân biệt hoa thường
        example: Đà Nẵng
        schema:
          type: string
      - &id001
        name: check_in
        in: query
        required: false
        description: Ngày nhận phòng (YYYY-MM-DD). Đi cùng check_out để chỉ trả phòng còn trống
        example: '2026-12-19'
        schema:
          type: string
          format: date
      - &id002
        name: check_out
        in: query
        required: false
        description: Ngày trả phòng (YYYY-MM-DD), phải sau check_in; khoảng ở [check_in, check_out)
        example: '2026-12-21'
        schema:
          type: string
          format: date
      - &id003
        name: guests
        in: query
        required: false
        description: Số khách; chỉ trả phòng có capacity >= guests
        example: 2
        schema:
          type: integer
          minimum: 1
      - &id004
        name: min_price_vnd
        in: query
        required: false
        description: Giá tối thiểu mỗi đêm (VND)
        example: 500000
        schema:
          type: integer
          minimum: 0
      - &id005
        name: max_price_vnd
        in: query
        required: false
        description: Giá tối đa mỗi đêm (VND)
        example: 1500000
        schema:
          type: integer
          minimum: 0
      - &id006
        name: page
        in: query
        required: false
        description: Trang cần lấy, bắt đầu từ 1
        schema:
          type: integer
          minimum: 1
          default: 1
      - &id007
        name: per_page
        in: query
        required: false
        description: Số phần tử mỗi trang
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 20
      - name: sort
        in: query
        required: false
        description: Sắp xếp theo whitelist; luôn thêm id làm tie-breaker để thứ tự ổn định
        schema:
          type: string
          enum:
          - name
          - -name
          - city
          - -city
          default: name
  /api/v1/hotels/{hotel_id}:
    get:
      tags:
      - Hotels
      operationId: getHotel
      summary: Chi tiết khách sạn
      responses:
        '200':
          description: Thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Hotel'
              example:
                id: 10000000-0000-4000-8000-000000000002
                name: HotelGenie Đà Nẵng Demo
                city: Đà Nẵng
                address: Hải Châu, Đà Nẵng, Việt Nam
                latitude: 16.0614
                longitude: 108.224
                description: Dữ liệu minh họa, không phải khách sạn thật
        '404':
          description: Không tìm thấy
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '500':
          description: Lỗi máy chủ
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
      parameters:
      - name: hotel_id
        in: path
        required: true
        description: ID khách sạn
        schema:
          type: string
          format: uuid
  /api/v1/hotels/{hotel_id}/rooms:
    get:
      tags:
      - Hotels
      operationId: listHotelRooms
      summary: Phòng thuộc khách sạn
      description: Ví dụ 200 dùng bộ lọc guests=2 và max_price_vnd=1500000.
      responses:
        '200':
          description: Thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RoomList'
              example:
                data:
                - id: 20000000-0000-4000-8000-000000000007
                  hotel_id: 10000000-0000-4000-8000-000000000002
                  name: Standard Double
                  capacity: 2
                  price_per_night_vnd: 800000
                  active: true
                - id: 20000000-0000-4000-8000-000000000003
                  hotel_id: 10000000-0000-4000-8000-000000000002
                  name: City View
                  capacity: 2
                  price_per_night_vnd: 1100000
                  active: true
                pagination:
                  page: 1
                  per_page: 20
                  total: 2
                  total_pages: 1
        '400':
          description: Dữ liệu không hợp lệ
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              example:
                type: about:blank
                title: Bad Request
                status: 400
                detail: Tham số phân trang không hợp lệ
                code: VALIDATION_ERROR
                request_id: req-demo-400
                errors:
                - field: per_page
                  message: per_page phải nằm trong khoảng từ 1 đến 100
        '404':
          description: Không tìm thấy
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '503':
          description: Dịch vụ chưa sẵn sàng
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '500':
          description: Lỗi máy chủ
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
      parameters:
      - name: hotel_id
        in: path
        required: true
        description: ID khách sạn
        schema:
          type: string
          format: uuid
      - *id001
      - *id002
      - *id003
      - *id004
      - *id005
      - *id006
      - *id007
  /api/v1/rooms/{room_id}:
    get:
      tags:
      - Hotels
      operationId: getRoom
      summary: Chi tiết phòng
      responses:
        '200':
          description: Thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Room'
              example:
                id: 20000000-0000-4000-8000-000000000003
                hotel_id: 10000000-0000-4000-8000-000000000002
                name: City View
                capacity: 2
                price_per_night_vnd: 1100000
                active: true
        '404':
          description: Không tìm thấy
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '500':
          description: Lỗi máy chủ
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
      parameters:
      - name: room_id
        in: path
        required: true
        description: ID phòng
        schema:
          type: string
          format: uuid
  /api/v1/bookings:
    post:
      tags:
      - Bookings
      operationId: createBooking
      summary: Tạo booking chống đặt trùng
      responses:
        '201':
          description: Thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Booking'
              example:
                id: 50000000-0000-4000-8000-000000000001
                user_id: 30000000-0000-4000-8000-000000000001
                room_id: 20000000-0000-4000-8000-000000000003
                check_in: '2026-12-19'
                check_out: '2026-12-21'
                guests: 2
                total_price_vnd: 2200000
                status: confirmed
                created_at: '2026-11-23T03:00:00Z'
          headers:
            Location:
              description: URI của booking đã tạo
              schema:
                type: string
            Idempotent-Replayed:
              description: true nếu đây là replay cùng key/body
              schema:
                type: boolean
        '400':
          description: Dữ liệu không hợp lệ
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '401':
          description: Chưa xác thực
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '404':
          description: Không tìm thấy
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '409':
          description: Phòng đã có booking trùng ngày, hoặc Idempotency-Key bị dùng lại với payload khác
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              examples:
                booking_overlap:
                  summary: Trùng ngày với booking đã xác nhận
                  value:
                    type: https://hotelgenie.local/problems/booking-overlap
                    title: Conflict
                    status: 409
                    detail: Phòng đã có booking trong khoảng 2026-12-19 đến 2026-12-21.
                    instance: /api/v1/bookings
                    code: BOOKING_OVERLAP
                    request_id: req-book-0002
                idempotency_key_reused:
                  summary: Cùng Idempotency-Key nhưng body khác
                  value:
                    type: https://hotelgenie.local/problems/idempotency-key-reused
                    title: Conflict
                    status: 409
                    detail: Idempotency-Key đã được dùng cho một yêu cầu khác.
                    instance: /api/v1/bookings
                    code: IDEMPOTENCY_KEY_REUSED
                    request_id: req-book-0003
        '422':
          description: Vi phạm ràng buộc dữ liệu
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '503':
          description: Dịch vụ chưa sẵn sàng
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '500':
          description: Lỗi máy chủ
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BookingRequest'
            example:
              room_id: 20000000-0000-4000-8000-000000000003
              check_in: '2026-12-19'
              check_out: '2026-12-21'
              guests: 2
      parameters:
      - name: Idempotency-Key
        in: header
        required: true
        description: Khoá duy nhất do client sinh cho mỗi lần đặt; gửi lại cùng khoá và cùng body sẽ trả lại đúng booking cũ, không tạo booking mới
        example: 7f3c1a2e-booking-0001
        schema:
          type: string
          minLength: 8
          maxLength: 128
      security:
      - bearerAuth: []
    get:
      tags:
      - Bookings
      operationId: listMyBookings
      summary: Chỉ xem booking của mình
      responses:
        '200':
          description: Thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookingList'
              example:
                data:
                - id: 50000000-0000-4000-8000-000000000001
                  user_id: 30000000-0000-4000-8000-000000000001
                  room_id: 20000000-0000-4000-8000-000000000003
                  check_in: '2026-12-19'
                  check_out: '2026-12-21'
                  guests: 2
                  total_price_vnd: 2200000
                  status: confirmed
                  created_at: '2026-11-23T03:00:00Z'
                pagination:
                  page: 1
                  per_page: 20
                  total: 1
                  total_pages: 1
        '401':
          description: Chưa xác thực
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '500':
          description: Lỗi máy chủ
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
      parameters:
      - name: page
        in: query
        required: false
        description: Trang cần lấy, bắt đầu từ 1
        schema:
          type: integer
          minimum: 1
          default: 1
      - name: per_page
        in: query
        required: false
        description: Số booking mỗi trang, mới nhất trước
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 20
      security:
      - bearerAuth: []
  /api/v1/bookings/{booking_id}:
    get:
      tags:
      - Bookings
      operationId: getMyBooking
      summary: Xem booking của mình
      responses:
        '200':
          description: Thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Booking'
        '401':
          description: Chưa xác thực
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '404':
          description: Không tìm thấy
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '500':
          description: Lỗi máy chủ
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
      parameters:
      - name: booking_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      security:
      - bearerAuth: []
    patch:
      tags:
      - Bookings
      operationId: cancelMyBooking
      summary: Hủy booking (idempotent)
      responses:
        '200':
          description: Thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Booking'
        '400':
          description: Dữ liệu không hợp lệ
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '401':
          description: Chưa xác thực
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '404':
          description: Không tìm thấy
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '409':
          description: Xung đột
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '422':
          description: Vi phạm ràng buộc dữ liệu
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '500':
          description: Lỗi máy chủ
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BookingPatch'
            example:
              status: cancelled
      parameters:
      - name: booking_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      security:
      - bearerAuth: []
  /api/v1/reviews:
    post:
      tags:
      - Reviews
      operationId: submitReview
      summary: Gửi review, trạng thái pending
      responses:
        '201':
          description: Thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Review'
              example:
                id: 40000000-0000-4000-8000-000000000001
                user_id: 30000000-0000-4000-8000-000000000001
                hotel_id: 10000000-0000-4000-8000-000000000002
                rating: 4
                content: Phòng sạch, gần cầu Rồng, nhân viên nhiệt tình.
                moderation_status: pending
                sentiment: null
                moderation_reason: null
                created_at: '2026-12-22T03:00:00Z'
        '400':
          description: Dữ liệu không hợp lệ
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '401':
          description: Chưa xác thực
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '404':
          description: Không tìm thấy
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '422':
          description: Vi phạm ràng buộc dữ liệu
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '500':
          description: Lỗi máy chủ
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReviewRequest'
            example:
              hotel_id: 10000000-0000-4000-8000-000000000002
              rating: 4
              content: Phòng sạch, gần cầu Rồng, nhân viên nhiệt tình.
      security:
      - bearerAuth: []
  /api/v1/hotels/{hotel_id}/reviews:
    get:
      tags:
      - Reviews
      operationId: listApprovedReviews
      summary: Review công khai đã duyệt
      responses:
        '200':
          description: Thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReviewList'
              example:
                data:
                - id: 40000000-0000-4000-8000-000000000001
                  user_id: 30000000-0000-4000-8000-000000000001
                  hotel_id: 10000000-0000-4000-8000-000000000002
                  rating: 4
                  content: Phòng sạch, gần cầu Rồng, nhân viên nhiệt tình.
                  moderation_status: approved
                  sentiment: positive
                  moderation_reason: Đánh giá tích cực, không có nội dung vi phạm.
                  created_at: '2026-12-22T03:00:00Z'
                pagination:
                  page: 1
                  per_page: 20
                  total: 1
                  total_pages: 1
        '400':
          description: Dữ liệu không hợp lệ
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '404':
          description: Không tìm thấy
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '500':
          description: Lỗi máy chủ
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
      parameters:
      - name: hotel_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: page
        in: query
        required: false
        description: Trang cần lấy, bắt đầu từ 1
        schema:
          type: integer
          minimum: 1
          default: 1
      - name: per_page
        in: query
        required: false
        description: Số review mỗi trang, mới nhất trước
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 20
  /api/v1/ai/searches:
    post:
      tags:
      - AI
      operationId: searchHotelsNaturalLanguage
      summary: Tìm phòng bằng prompt tiếng Việt
      responses:
        '200':
          description: Thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AISearchResponse'
              examples:
                du_thong_tin:
                  summary: Đủ thành phố, ngày, số khách – trả phòng thật từ Hotel Service
                  value:
                    filters:
                      city: Đà Nẵng
                      check_in: '2026-12-19'
                      check_out: '2026-12-21'
                      guests: 2
                      min_price_vnd: null
                      max_price_vnd: 1200000
                    rooms:
                    - id: 20000000-0000-4000-8000-000000000007
                      hotel_id: 10000000-0000-4000-8000-000000000002
                      name: Standard Double
                      capacity: 2
                      price_per_night_vnd: 800000
                      active: true
                    - id: 20000000-0000-4000-8000-000000000003
                      hotel_id: 10000000-0000-4000-8000-000000000002
                      name: City View
                      capacity: 2
                      price_per_night_vnd: 1100000
                      active: true
                    needs_clarification: false
                    clarification_fields: []
                    availability_verified: true
                can_lam_ro:
                  summary: Thiếu ngày – không trả phòng, yêu cầu bổ sung
                  value:
                    filters:
                      city: Hà Nội
                      check_in: null
                      check_out: null
                      guests: 2
                      min_price_vnd: null
                      max_price_vnd: 1500000
                    rooms: []
                    needs_clarification: true
                    clarification_fields:
                    - check_in
                    - check_out
                    availability_verified: false
        '400':
          description: Dữ liệu không hợp lệ
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '422':
          description: Vi phạm ràng buộc dữ liệu
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '429':
          description: Vượt giới hạn gọi AI (bảo vệ quota Gemini)
          headers:
            Retry-After:
              description: Số giây nên chờ trước khi gọi lại
              schema:
                type: integer
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              example:
                type: https://hotelgenie.local/problems/ai-rate-limited
                title: Too Many Requests
                status: 429
                detail: Bạn đã gửi quá nhiều yêu cầu tìm kiếm AI, thử lại sau.
                instance: /api/v1/ai/searches
                code: AI_RATE_LIMITED
                request_id: req-ai-0002
        '502':
          description: Lỗi nhà cung cấp
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '503':
          description: Dịch vụ chưa sẵn sàng
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              example:
                type: https://hotelgenie.local/problems/ai-provider-unavailable
                title: Service Unavailable
                status: 503
                detail: Dịch vụ AI tạm thời không phản hồi; hãy dùng bộ lọc tìm phòng thông thường.
                instance: /api/v1/ai/searches
                code: AI_PROVIDER_UNAVAILABLE
                request_id: req-ai-0003
        '504':
          description: Hết thời gian chờ
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '500':
          description: Lỗi máy chủ
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AISearchRequest'
            example:
              prompt: Phòng ở Đà Nẵng cho 2 người từ 19/12 đến 21/12, dưới 1,2 triệu
  /api/v1/hotels/{hotel_id}/nearby-places:
    get:
      tags:
      - AI
      operationId: getNearbyPlaces
      summary: Gợi ý địa điểm gần khách sạn
      responses:
        '200':
          description: Thành công
          content:
