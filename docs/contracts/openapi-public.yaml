openapi: 3.0.3
info:
  title: HotelGenie Public API
  version: 1.0.0
  description: Hợp đồng thiết kế v1.0 (draft). API công khai qua gateway; chưa triển khai.
servers:
- url: http://localhost:8080
  description: Gateway demo (đề xuất; kiểm chứng khi Compose có thật)
tags:
- name: Auth
- name: Hotels
- name: Bookings
- name: Reviews
- name: AI
paths:
  /api/v1/auth/register:
    post:
      tags:
      - Auth
      operationId: registerUser
      summary: Đăng ký tài khoản
      responses:
        '201':
          description: Thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          description: Dữ liệu không hợp lệ
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '409':
          description: Xung đột
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '422':
          description: Vi phạm ràng buộc dữ liệu
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '500':
          description: Lỗi máy chủ
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
  /api/v1/auth/token:
    post:
      tags:
      - Auth
      operationId: issueToken
      summary: Đăng nhập, nhận JWT
      responses:
        '200':
          description: Thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
        '400':
          description: Dữ liệu không hợp lệ
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '401':
          description: Chưa xác thực
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '500':
          description: Lỗi máy chủ
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenRequest'
  /api/v1/users/me:
    get:
      tags:
      - Auth
      operationId: getCurrentUser
      summary: Hồ sơ người dùng hiện tại
      responses:
        '200':
          description: Thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '401':
          description: Chưa xác thực
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '500':
          description: Lỗi máy chủ
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
      security:
      - bearerAuth: []
  /api/v1/hotels:
    get:
      tags:
      - Hotels
      operationId: listHotels
      summary: Danh sách khách sạn; có thể lọc theo khả dụng
      responses:
        '200':
          description: Thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HotelList'
        '400':
          description: Dữ liệu không hợp lệ
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '422':
          description: Vi phạm ràng buộc dữ liệu
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '503':
          description: Dịch vụ chưa sẵn sàng
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '500':
          description: Lỗi máy chủ
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
      parameters:
      - name: city
        in: query
        required: false
        description: ''
        schema:
          type: string
      - &id001
        name: check_in
        in: query
        required: false
        description: ''
        schema:
          type: string
          format: date
      - &id002
        name: check_out
        in: query
        required: false
        description: ''
        schema:
          type: string
          format: date
      - &id003
        name: guests
        in: query
        required: false
        description: ''
        schema:
          type: integer
          minimum: 1
      - &id004
        name: min_price_vnd
        in: query
        required: false
        description: ''
        schema:
          type: integer
          minimum: 0
      - &id005
        name: max_price_vnd
        in: query
        required: false
        description: ''
        schema:
          type: integer
          minimum: 0
      - &id006
        name: page
        in: query
        required: false
        description: ''
        schema:
          type: integer
          minimum: 1
      - &id007
        name: per_page
        in: query
        required: false
        description: ''
        schema:
          type: integer
          minimum: 1
      - name: sort
        in: query
        required: false
        description: ''
        schema:
          type: string
  /api/v1/hotels/{hotel_id}:
    get:
      tags:
      - Hotels
      operationId: getHotel
      summary: Chi tiết khách sạn
      responses:
        '200':
          description: Thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Hotel'
        '404':
          description: Không tìm thấy
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '500':
          description: Lỗi máy chủ
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
      parameters:
      - name: hotel_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
  /api/v1/hotels/{hotel_id}/rooms:
    get:
      tags:
      - Hotels
      operationId: listHotelRooms
      summary: Phòng thuộc khách sạn
      responses:
        '200':
          description: Thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RoomList'
        '400':
          description: Dữ liệu không hợp lệ
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '404':
          description: Không tìm thấy
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '503':
          description: Dịch vụ chưa sẵn sàng
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '500':
          description: Lỗi máy chủ
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
      parameters:
      - name: hotel_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - *id001
      - *id002
      - *id003
      - *id004
      - *id005
      - *id006
      - *id007
  /api/v1/rooms/{room_id}:
    get:
      tags:
      - Hotels
      operationId: getRoom
      summary: Chi tiết phòng
      responses:
        '200':
          description: Thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Room'
        '404':
          description: Không tìm thấy
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '500':
          description: Lỗi máy chủ
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
      parameters:
      - name: room_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
  /api/v1/bookings:
    post:
      tags:
      - Bookings
      operationId: createBooking
      summary: Tạo booking chống đặt trùng
      responses:
        '201':
          description: Thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Booking'
              example:
                id: 50000000-0000-4000-8000-000000000001
                user_id: 30000000-0000-4000-8000-000000000001
                room_id: 20000000-0000-4000-8000-000000000003
                check_in: '2026-12-19'
                check_out: '2026-12-21'
                guests: 2
                total_price_vnd: 2200000
                status: confirmed
                created_at: '2026-11-23T03:00:00Z'
          headers:
            Location:
              description: URI của booking đã tạo
              schema:
                type: string
            Idempotent-Replayed:
              description: true nếu đây là replay cùng key/body
              schema:
                type: boolean
        '400':
          description: Dữ liệu không hợp lệ
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '401':
          description: Chưa xác thực
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '404':
          description: Không tìm thấy
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '409':
          description: Phòng đã có booking trùng ngày, hoặc Idempotency-Key bị dùng lại với payload khác
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              examples:
                booking_overlap:
                  summary: Trùng ngày với booking đã xác nhận
                  value:
                    type: https://hotelgenie.local/problems/booking-overlap
                    title: Conflict
                    status: 409
                    detail: Phòng đã có booking trong khoảng 2026-12-19 đến 2026-12-21.
                    instance: /api/v1/bookings
                    code: BOOKING_OVERLAP
                    request_id: req-book-0002
                idempotency_key_reused:
                  summary: Cùng Idempotency-Key nhưng body khác
                  value:
                    type: https://hotelgenie.local/problems/idempotency-key-reused
                    title: Conflict
                    status: 409
                    detail: Idempotency-Key đã được dùng cho một yêu cầu khác.
                    instance: /api/v1/bookings
                    code: IDEMPOTENCY_KEY_REUSED
                    request_id: req-book-0003
        '422':
          description: Vi phạm ràng buộc dữ liệu
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '503':
          description: Dịch vụ chưa sẵn sàng
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '500':
          description: Lỗi máy chủ
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BookingRequest'
            example:
              room_id: 20000000-0000-4000-8000-000000000003
              check_in: '2026-12-19'
              check_out: '2026-12-21'
              guests: 2
      parameters:
      - name: Idempotency-Key
        in: header
        required: true
        description: Khoá duy nhất do client sinh cho mỗi lần đặt; gửi lại cùng khoá và cùng body sẽ trả lại đúng booking cũ, không tạo booking mới
        example: 7f3c1a2e-booking-0001
        schema:
          type: string
          minLength: 8
          maxLength: 128
      security:
      - bearerAuth: []
    get:
      tags:
      - Bookings
      operationId: listMyBookings
      summary: Chỉ xem booking của mình
      responses:
        '200':
          description: Thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookingList'
              example:
                data:
                - id: 50000000-0000-4000-8000-000000000001
                  user_id: 30000000-0000-4000-8000-000000000001
                  room_id: 20000000-0000-4000-8000-000000000003
                  check_in: '2026-12-19'
                  check_out: '2026-12-21'
                  guests: 2
                  total_price_vnd: 2200000
                  status: confirmed
                  created_at: '2026-11-23T03:00:00Z'
                pagination:
                  page: 1
                  per_page: 20
                  total: 1
                  total_pages: 1
        '401':
          description: Chưa xác thực
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '500':
          description: Lỗi máy chủ
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
      parameters:
      - name: page
        in: query
        required: false
        description: Trang cần lấy, bắt đầu từ 1
        schema:
          type: integer
          minimum: 1
          default: 1
      - name: per_page
        in: query
        required: false
        description: Số booking mỗi trang, mới nhất trước
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 20
      security:
      - bearerAuth: []
  /api/v1/bookings/{booking_id}:
    get:
      tags:
      - Bookings
      operationId: getMyBooking
      summary: Xem booking của mình
      responses:
        '200':
          description: Thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Booking'
        '401':
          description: Chưa xác thực
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '404':
          description: Không tìm thấy
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '500':
          description: Lỗi máy chủ
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
      parameters:
      - name: booking_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      security:
      - bearerAuth: []
    patch:
      tags:
      - Bookings
      operationId: cancelMyBooking
      summary: Hủy booking (idempotent)
      responses:
        '200':
          description: Thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Booking'
        '400':
          description: Dữ liệu không hợp lệ
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '401':
          description: Chưa xác thực
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '404':
          description: Không tìm thấy
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '409':
          description: Xung đột
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '422':
          description: Vi phạm ràng buộc dữ liệu
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '500':
          description: Lỗi máy chủ
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BookingPatch'
            example:
              status: cancelled
      parameters:
      - name: booking_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      security:
      - bearerAuth: []
  /api/v1/reviews:
    post:
      tags:
      - Reviews
      operationId: submitReview
      summary: Gửi review, trạng thái pending
      responses:
        '201':
          description: Thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Review'
        '400':
          description: Dữ liệu không hợp lệ
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '401':
          description: Chưa xác thực
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '404':
          description: Không tìm thấy
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '422':
          description: Vi phạm ràng buộc dữ liệu
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '500':
          description: Lỗi máy chủ
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReviewRequest'
      security:
      - bearerAuth: []
  /api/v1/hotels/{hotel_id}/reviews:
    get:
      tags:
      - Reviews
      operationId: listApprovedReviews
      summary: Review công khai đã duyệt
      responses:
        '200':
          description: Thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReviewList'
        '400':
          description: Dữ liệu không hợp lệ
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '404':
          description: Không tìm thấy
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '500':
          description: Lỗi máy chủ
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
      parameters:
      - name: hotel_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: page
        in: query
        required: false
        description: ''
        schema:
          type: integer
          minimum: 1
      - name: per_page
        in: query
        required: false
        description: ''
        schema:
          type: integer
          minimum: 1
  /api/v1/ai/searches:
    post:
      tags:
      - AI
      operationId: searchHotelsNaturalLanguage
      summary: Tìm phòng bằng prompt tiếng Việt
      responses:
        '200':
          description: Thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AISearchResponse'
        '400':
          description: Dữ liệu không hợp lệ
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '422':
          description: Vi phạm ràng buộc dữ liệu
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '502':
          description: Lỗi nhà cung cấp
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '503':
          description: Dịch vụ chưa sẵn sàng
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '504':
          description: Hết thời gian chờ
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '500':
          description: Lỗi máy chủ
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AISearchRequest'
  /api/v1/hotels/{hotel_id}/nearby-places:
    get:
      tags:
      - AI
      operationId: getNearbyPlaces
      summary: Gợi ý địa điểm gần khách sạn
      responses:
        '200':
          description: Thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NearbyResponse'
              example:
                data:
                - provider_id: seed-dn-004
                  name: Chợ Hàn
                  category: food
                  latitude: 16.0679
                  longitude: 108.2242
                  address: 119 Trần Phú, Hải Châu, Đà Nẵng
                  source: seed
                  is_fallback: true
                  explanation: Cách khách sạn khoảng 0,7 km, có nhiều món ăn địa phương và đặc sản để mua về.
                - provider_id: seed-dn-005
                  name: Chợ Cồn
                  category: food
                  latitude: 16.0681
                  longitude: 108.2139
                  address: 290 Hùng Vương, Hải Châu, Đà Nẵng
                  source: seed
                  is_fallback: true
                  explanation: Khu ăn vặt nổi tiếng của người địa phương, cách khách sạn khoảng 1,3 km.
                source: seed
                is_fallback: true
        '400':
          description: Dữ liệu không hợp lệ
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '404':
          description: Không tìm thấy
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '429':
          description: Vượt giới hạn gọi AI/Places provider
          headers:
            Retry-After:
              description: Số giây nên chờ trước khi gọi lại
              schema:
                type: integer
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '503':
          description: Dịch vụ chưa sẵn sàng
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '500':
          description: Lỗi máy chủ
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
      parameters:
      - name: hotel_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: category
        in: query
        required: false
        description: Loại địa điểm; bỏ trống để lấy tất cả
        schema:
          type: string
          enum:
          - food
          - transport
          - entertainment
      - name: radius_m
        in: query
        required: false
        description: Bán kính tìm kiếm tính từ khách sạn (mét)
        schema:
          type: integer
          minimum: 100
          maximum: 5000
          default: 1000
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    Problem:
      type: object
      additionalProperties: false
      required:
      - type
      - title
      - status
      - detail
      - code
      - request_id
      properties:
        type:
          type: string
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        instance:
          type: string
        code:
          type: string
        request_id:
          type: string
    RegisterRequest:
      type: object
      additionalProperties: false
      required:
      - email
      - password
      - full_name
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 8
        full_name:
          type: string
          minLength: 1
          maxLength: 120
    TokenRequest:
