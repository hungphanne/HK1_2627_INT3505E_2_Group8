openapi: 3.0.3
info:
  title: HotelGenie Public API
  version: 1.0.0
  description: Hợp đồng thiết kế v1.0 (draft). API công khai qua gateway; chưa triển khai.
servers:
- url: http://localhost:8080
  description: Gateway demo (đề xuất; kiểm chứng khi Compose có thật)
- url: http://127.0.0.1:4010
  description: Prism mock server – demo tuần 12 (docs/08-development-testing.md)
tags:
- name: Auth
- name: Hotels
- name: Bookings
- name: Reviews
- name: AI
paths:
  /api/v1/auth/register:
    post:
      tags:
      - Auth
      operationId: registerUser
      summary: Đăng ký tài khoản
      responses:
        '201':
          description: Thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          description: Dữ liệu không hợp lệ
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '409':
          description: Xung đột
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '422':
          description: Vi phạm ràng buộc dữ liệu
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '500':
          description: Lỗi máy chủ
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
  /api/v1/auth/token:
    post:
      tags:
      - Auth
      operationId: issueToken
      summary: Đăng nhập, nhận JWT
      responses:
        '200':
          description: Thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
        '400':
          description: Dữ liệu không hợp lệ
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '401':
          description: Chưa xác thực
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '500':
          description: Lỗi máy chủ
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenRequest'
  /api/v1/users/me:
    get:
      tags:
      - Auth
      operationId: getCurrentUser
      summary: Hồ sơ người dùng hiện tại
      responses:
        '200':
          description: Thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '401':
          description: Chưa xác thực
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '500':
          description: Lỗi máy chủ
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
      security:
      - bearerAuth: []
  /api/v1/hotels:
    get:
      tags:
      - Hotels
      operationId: listHotels
      summary: Danh sách khách sạn; có thể lọc theo khả dụng
      responses:
        '200':
          description: Thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HotelList'
        '400':
          description: Dữ liệu không hợp lệ
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '422':
          description: Vi phạm ràng buộc dữ liệu
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '503':
          description: Dịch vụ chưa sẵn sàng
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '500':
          description: Lỗi máy chủ
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
      parameters:
      - name: city
        in: query
        required: false
        description: ''
        schema:
          type: string
      - &id001
        name: check_in
        in: query
        required: false
        description: ''
        schema:
          type: string
          format: date
      - &id002
        name: check_out
        in: query
        required: false
        description: ''
        schema:
          type: string
          format: date
      - &id003
        name: guests
        in: query
        required: false
        description: ''
        schema:
          type: integer
          minimum: 1
      - &id004
        name: min_price_vnd
        in: query
        required: false
        description: ''
        schema:
          type: integer
          minimum: 0
      - &id005
        name: max_price_vnd
        in: query
        required: false
        description: ''
        schema:
          type: integer
          minimum: 0
      - &id006
        name: page
        in: query
        required: false
        description: ''
        schema:
          type: integer
          minimum: 1
      - &id007
        name: per_page
        in: query
        required: false
        description: ''
        schema:
          type: integer
          minimum: 1
      - name: sort
        in: query
        required: false
        description: ''
        schema:
          type: string
  /api/v1/hotels/{hotel_id}:
    get:
      tags:
      - Hotels
      operationId: getHotel
      summary: Chi tiết khách sạn
      responses:
        '200':
          description: Thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Hotel'
        '404':
          description: Không tìm thấy
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '500':
          description: Lỗi máy chủ
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
      parameters:
      - name: hotel_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
  /api/v1/hotels/{hotel_id}/rooms:
    get:
      tags:
      - Hotels
      operationId: listHotelRooms
      summary: Phòng thuộc khách sạn
      responses:
        '200':
          description: Thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RoomList'
        '400':
          description: Dữ liệu không hợp lệ
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '404':
          description: Không tìm thấy
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '503':
          description: Dịch vụ chưa sẵn sàng
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '500':
          description: Lỗi máy chủ
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
      parameters:
      - name: hotel_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - *id001
      - *id002
      - *id003
      - *id004
      - *id005
      - *id006
      - *id007
  /api/v1/rooms/{room_id}:
    get:
      tags:
      - Hotels
      operationId: getRoom
      summary: Chi tiết phòng
      responses:
        '200':
          description: Thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Room'
        '404':
          description: Không tìm thấy
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '500':
          description: Lỗi máy chủ
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
      parameters:
      - name: room_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
  /api/v1/bookings:
    post:
      tags:
      - Bookings
      operationId: createBooking
      summary: Tạo booking chống đặt trùng
      responses:
        '201':
          description: Thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Booking'
          headers:
            Location:
              description: URI của booking đã tạo
              schema:
                type: string
            Idempotent-Replayed:
              description: true nếu đây là replay cùng key/body
              schema:
                type: boolean
        '400':
          description: Dữ liệu không hợp lệ
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '401':
          description: Chưa xác thực
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '404':
          description: Không tìm thấy
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '409':
          description: Xung đột
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '422':
          description: Vi phạm ràng buộc dữ liệu
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '503':
          description: Dịch vụ chưa sẵn sàng
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '500':
          description: Lỗi máy chủ
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BookingRequest'
      parameters:
      - name: Idempotency-Key
        in: header
        required: true
        schema:
          type: string
          minLength: 8
          maxLength: 128
      security:
      - bearerAuth: []
    get:
      tags:
      - Bookings
      operationId: listMyBookings
      summary: Chỉ xem booking của mình
      responses:
        '200':
          description: Thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookingList'
        '401':
          description: Chưa xác thực
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '500':
          description: Lỗi máy chủ
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
      parameters:
      - name: page
        in: query
        required: false
        description: ''
        schema:
          type: integer
          minimum: 1
      - name: per_page
        in: query
        required: false
        description: ''
        schema:
          type: integer
          minimum: 1
      security:
      - bearerAuth: []
  /api/v1/bookings/{booking_id}:
    get:
      tags:
      - Bookings
      operationId: getMyBooking
      summary: Xem booking của mình
      responses:
        '200':
          description: Thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Booking'
        '401':
          description: Chưa xác thực
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '404':
          description: Không tìm thấy
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '500':
          description: Lỗi máy chủ
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
      parameters:
      - name: booking_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      security:
      - bearerAuth: []
    patch:
      tags:
      - Bookings
      operationId: cancelMyBooking
      summary: Hủy booking (idempotent)
      responses:
        '200':
          description: Thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Booking'
        '400':
          description: Dữ liệu không hợp lệ
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '401':
          description: Chưa xác thực
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '404':
          description: Không tìm thấy
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '409':
          description: Xung đột
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '422':
          description: Vi phạm ràng buộc dữ liệu
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '500':
          description: Lỗi máy chủ
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BookingPatch'
      parameters:
      - name: booking_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      security:
      - bearerAuth: []
  /api/v1/reviews:
    post:
      tags:
      - Reviews
      operationId: submitReview
      summary: Gửi review, trạng thái pending
      responses:
        '201':
          description: Thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Review'
        '400':
          description: Dữ liệu không hợp lệ
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '401':
          description: Chưa xác thực
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '404':
          description: Không tìm thấy
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '422':
          description: Vi phạm ràng buộc dữ liệu
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '500':
          description: Lỗi máy chủ
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReviewRequest'
      security:
      - bearerAuth: []
  /api/v1/hotels/{hotel_id}/reviews:
    get:
      tags:
      - Reviews
      operationId: listApprovedReviews
      summary: Review công khai đã duyệt
      responses:
        '200':
          description: Thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReviewList'
        '400':
          description: Dữ liệu không hợp lệ
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '404':
          description: Không tìm thấy
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '500':
          description: Lỗi máy chủ
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
      parameters:
      - name: hotel_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: page
        in: query
        required: false
        description: ''
        schema:
          type: integer
          minimum: 1
      - name: per_page
        in: query
        required: false
        description: ''
        schema:
          type: integer
          minimum: 1
  /api/v1/ai/searches:
    post:
      tags:
      - AI
      operationId: searchHotelsNaturalLanguage
      summary: Tìm phòng bằng prompt tiếng Việt
      responses:
        '200':
          description: Thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AISearchResponse'
        '400':
          description: Dữ liệu không hợp lệ
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '422':
          description: Vi phạm ràng buộc dữ liệu
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '502':
          description: Lỗi nhà cung cấp
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '503':
          description: Dịch vụ chưa sẵn sàng
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '504':
          description: Hết thời gian chờ
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '500':
          description: Lỗi máy chủ
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AISearchRequest'
  /api/v1/hotels/{hotel_id}/nearby-places:
    get:
      tags:
      - AI
      operationId: getNearbyPlaces
      summary: Gợi ý địa điểm gần khách sạn
      responses:
        '200':
          description: Thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NearbyResponse'
        '400':
          description: Dữ liệu không hợp lệ
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '404':
          description: Không tìm thấy
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '503':
          description: Dịch vụ chưa sẵn sàng
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '500':
          description: Lỗi máy chủ
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
      parameters:
      - name: hotel_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: category
        in: query
        required: false
        description: ''
        schema:
          type: string
      - name: radius_m
        in: query
        required: false
        description: ''
        schema:
          type: integer
          minimum: 1
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    Problem:
      type: object
      additionalProperties: false
      required:
      - type
      - title
      - status
      - detail
      - code
      - request_id
      properties:
        type:
          type: string
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        instance:
          type: string
        code:
          type: string
        request_id:
          type: string
    RegisterRequest:
      type: object
      additionalProperties: false
      required:
      - email
      - password
      - full_name
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 8
        full_name:
          type: string
          minLength: 1
          maxLength: 120
    TokenRequest:
      type: object
      additionalProperties: false
      required:
      - email
      - password
      properties:
        email:
          type: string
          format: email
        password:
          type: string
    User:
      type: object
      additionalProperties: false
      required:
      - id
      - email
      - full_name
      - role
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        full_name:
          type: string
        role:
          type: string
          enum:
          - customer
    TokenResponse:
      type: object
      additionalProperties: false
      required:
      - access_token
      - token_type
      - expires_in
      properties:
        access_token:
          type: string
        token_type:
          type: string
          enum:
          - Bearer
        expires_in:
          type: integer
          minimum: 1
    Hotel:
      type: object
      additionalProperties: false
      required:
      - id
      - name
      - city
      - address
      - latitude
      - longitude
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        city:
          type: string
        address:
          type: string
        latitude:
          type: number
          minimum: -90
          maximum: 90
        longitude:
          type: number
          minimum: -180
          maximum: 180
        description:
          type: string
    Room:
      type: object
      additionalProperties: false
      required:
      - id
      - hotel_id
      - name
      - capacity
      - price_per_night_vnd
      - active
      properties:
        id:
          type: string
          format: uuid
        hotel_id:
          type: string
          format: uuid
        name:
          type: string
        capacity:
          type: integer
          minimum: 1
        price_per_night_vnd:
          type: integer
          minimum: 0
        active:
          type: boolean
    Pagination:
      type: object
      additionalProperties: false
      required:
      - page
      - per_page
      - total
      - total_pages
      properties:
        page:
          type: integer
          minimum: 1
        per_page:
          type: integer
          minimum: 1
        total:
          type: integer
          minimum: 0
        total_pages:
          type: integer
          minimum: 0
    HotelList:
      type: object
      additionalProperties: false
      required:
      - data
      - pagination
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Hotel'
        pagination:
          $ref: '#/components/schemas/Pagination'
    RoomList:
      type: object
      additionalProperties: false
      required:
      - data
      - pagination
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Room'
        pagination:
          $ref: '#/components/schemas/Pagination'
    BookingRequest:
      type: object
      additionalProperties: false
      required:
      - room_id
      - check_in
      - check_out
      - guests
      properties:
        room_id:
          type: string
          format: uuid
        check_in:
          type: string
          format: date
        check_out:
          type: string
          format: date
        guests:
          type: integer
          minimum: 1
    Booking:
      type: object
      additionalProperties: false
      required:
      - id
      - user_id
      - room_id
      - check_in
      - check_out
      - guests
      - total_price_vnd
      - status
      - created_at
      properties:
        id:
          type: string
          format: uuid
        user_id:
          type: string
          format: uuid
        room_id:
          type: string
          format: uuid
        check_in:
          type: string
          format: date
        check_out:
          type: string
          format: date
        guests:
          type: integer
          minimum: 1
        total_price_vnd:
          type: integer
          minimum: 0
        status:
          type: string
          enum:
          - confirmed
          - cancelled
        created_at:
          type: string
          format: date-time
    BookingList:
