                  explanation: Cách khách sạn khoảng 0,7 km, có nhiều món ăn địa phương và đặc sản để mua về.
                - provider_id: seed-dn-005
                  name: Chợ Cồn
                  category: food
                  latitude: 16.0681
                  longitude: 108.2139
                  address: 290 Hùng Vương, Hải Châu, Đà Nẵng
                  source: seed
                  is_fallback: true
                  explanation: Khu ăn vặt nổi tiếng của người địa phương, cách khách sạn khoảng 1,3 km.
                source: seed
                is_fallback: true
        '400':
          description: Dữ liệu không hợp lệ
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '404':
          description: Không tìm thấy
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '429':
          description: Vượt giới hạn gọi AI/Places provider
          headers:
            Retry-After:
              description: Số giây nên chờ trước khi gọi lại
              schema:
                type: integer
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '503':
          description: Dịch vụ chưa sẵn sàng
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '500':
          description: Lỗi máy chủ
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
      parameters:
      - name: hotel_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: category
        in: query
        required: false
        description: Loại địa điểm; bỏ trống để lấy tất cả
        schema:
          type: string
          enum:
          - food
          - transport
          - entertainment
      - name: radius_m
        in: query
        required: false
        description: Bán kính tìm kiếm tính từ khách sạn (mét)
        schema:
          type: integer
          minimum: 100
          maximum: 5000
          default: 1000
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    Problem:
      type: object
      additionalProperties: false
      required:
      - type
      - title
      - status
      - detail
      - code
      - request_id
      properties:
        type:
          type: string
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        instance:
          type: string
        code:
          type: string
        request_id:
          type: string
        errors:
          type: array
          description: Lỗi theo từng field, chỉ có ở 400/422 validation
          items:
            type: object
            additionalProperties: false
            required:
            - field
            - message
            properties:
              field:
                type: string
              message:
                type: string
    RegisterRequest:
      type: object
      additionalProperties: false
      required:
      - email
      - password
      - full_name
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 8
        full_name:
          type: string
          minLength: 1
          maxLength: 120
    TokenRequest:
      type: object
      additionalProperties: false
      required:
      - email
      - password
      properties:
        email:
          type: string
          format: email
        password:
          type: string
    User:
      type: object
      additionalProperties: false
      required:
      - id
      - email
      - full_name
      - role
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        full_name:
          type: string
        role:
          type: string
          enum:
          - customer
    TokenResponse:
      type: object
      additionalProperties: false
      required:
      - access_token
      - token_type
      - expires_in
      properties:
        access_token:
          type: string
        token_type:
          type: string
          enum:
          - Bearer
        expires_in:
          type: integer
          minimum: 1
    Hotel:
      type: object
      additionalProperties: false
      required:
      - id
      - name
      - city
      - address
      - latitude
      - longitude
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        city:
          type: string
        address:
          type: string
        latitude:
          type: number
          minimum: -90
          maximum: 90
        longitude:
          type: number
          minimum: -180
          maximum: 180
        description:
          type: string
    Room:
      type: object
      additionalProperties: false
      required:
      - id
      - hotel_id
      - name
      - capacity
      - price_per_night_vnd
      - active
      properties:
        id:
          type: string
          format: uuid
        hotel_id:
          type: string
          format: uuid
        name:
          type: string
        capacity:
          type: integer
          minimum: 1
        price_per_night_vnd:
          type: integer
          minimum: 0
        active:
          type: boolean
    Pagination:
      type: object
      additionalProperties: false
      required:
      - page
      - per_page
      - total
      - total_pages
      properties:
        page:
          type: integer
          minimum: 1
        per_page:
          type: integer
          minimum: 1
        total:
          type: integer
          minimum: 0
        total_pages:
          type: integer
          minimum: 0
    HotelList:
      type: object
      additionalProperties: false
      required:
      - data
      - pagination
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Hotel'
        pagination:
          $ref: '#/components/schemas/Pagination'
    RoomList:
      type: object
      additionalProperties: false
      required:
      - data
      - pagination
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Room'
        pagination:
          $ref: '#/components/schemas/Pagination'
    BookingRequest:
      type: object
      additionalProperties: false
      required:
      - room_id
      - check_in
      - check_out
      - guests
      properties:
        room_id:
          type: string
          format: uuid
        check_in:
          type: string
          format: date
        check_out:
          type: string
          format: date
        guests:
          type: integer
          minimum: 1
    Booking:
      type: object
      additionalProperties: false
      required:
      - id
      - user_id
      - room_id
      - check_in
      - check_out
      - guests
      - total_price_vnd
      - status
      - created_at
      properties:
        id:
          type: string
          format: uuid
        user_id:
          type: string
          format: uuid
        room_id:
          type: string
          format: uuid
        check_in:
          type: string
          format: date
        check_out:
          type: string
          format: date
        guests:
          type: integer
          minimum: 1
        total_price_vnd:
          type: integer
          minimum: 0
        status:
          type: string
          enum:
          - confirmed
          - cancelled
        created_at:
          type: string
          format: date-time
    BookingList:
      type: object
      additionalProperties: false
      required:
      - data
      - pagination
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Booking'
        pagination:
          $ref: '#/components/schemas/Pagination'
    BookingPatch:
      type: object
      additionalProperties: false
      required:
      - status
      properties:
        status:
          type: string
          enum:
          - cancelled
    ReviewRequest:
      type: object
      additionalProperties: false
      required:
      - hotel_id
      - rating
      - content
      properties:
        hotel_id:
          type: string
          format: uuid
        rating:
          type: integer
          minimum: 1
          maximum: 5
        content:
          type: string
          minLength: 1
          maxLength: 3000
    Review:
      type: object
      additionalProperties: false
      required:
      - id
      - user_id
      - hotel_id
      - rating
      - content
      - moderation_status
      - created_at
      properties:
        id:
          type: string
          format: uuid
        user_id:
          type: string
          format: uuid
        hotel_id:
          type: string
          format: uuid
        rating:
          type: integer
          minimum: 1
          maximum: 5
        content:
          type: string
        moderation_status:
          type: string
          enum:
          - pending
          - approved
          - flagged
          - rejected
        sentiment:
          type: string
          nullable: true
          enum:
          - positive
          - neutral
          - negative
          - null
          description: Cảm xúc do AI xác định; null khi đang pending
        moderation_reason:
          type: string
          nullable: true
          description: Lý do kiểm duyệt do AI đưa ra (event review.moderated); null khi đang pending
        created_at:
          type: string
          format: date-time
    ReviewList:
      type: object
      additionalProperties: false
      required:
      - data
      - pagination
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Review'
        pagination:
          $ref: '#/components/schemas/Pagination'
    AISearchRequest:
      type: object
      additionalProperties: false
      required:
      - prompt
      properties:
        prompt:
          type: string
          minLength: 1
          maxLength: 1000
    SearchFilters:
      type: object
      additionalProperties: false
      required:
      - city
      - check_in
      - check_out
      - guests
      - min_price_vnd
      - max_price_vnd
      properties:
        city:
          type: string
          nullable: true
        check_in:
          type: string
          format: date
          nullable: true
        check_out:
          type: string
          format: date
          nullable: true
        guests:
          type: integer
          minimum: 1
          nullable: true
        min_price_vnd:
          type: integer
          minimum: 0
          nullable: true
        max_price_vnd:
          type: integer
          minimum: 0
          nullable: true
    AISearchResponse:
      type: object
      additionalProperties: false
      required:
      - filters
      - rooms
      - needs_clarification
      - clarification_fields
      - availability_verified
      properties:
        filters:
          $ref: '#/components/schemas/SearchFilters'
        rooms:
          type: array
          items:
            $ref: '#/components/schemas/Room'
        needs_clarification:
          type: boolean
        availability_verified:
          type: boolean
          description: true khi đã có check_in/check_out và phòng trả về đã được Booking Service xác nhận còn trống
        clarification_fields:
          type: array
          items:
            type: string
    NearbyPlace:
      type: object
      additionalProperties: false
      required:
      - provider_id
      - name
      - category
      - latitude
      - longitude
      - source
      - is_fallback
      properties:
        provider_id:
          type: string
        name:
          type: string
        category:
          type: string
          enum:
          - food
          - transport
          - entertainment
        latitude:
          type: number
        longitude:
          type: number
        address:
          type: string
        source:
          type: string
          enum:
          - google
          - osm
          - seed
        is_fallback:
          type: boolean
        explanation:
          type: string
    NearbyResponse:
      type: object
      additionalProperties: false
      required:
      - data
      - source
      - is_fallback
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/NearbyPlace'
        source:
          type: string
          enum:
          - google
          - osm
          - seed
        is_fallback:
          type: boolean
