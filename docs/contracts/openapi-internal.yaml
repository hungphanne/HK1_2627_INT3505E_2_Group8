openapi: 3.0.3
info:
  title: HotelGenie Internal Service API
  version: 1.0.0
  description: Service-to-service only; không expose qua public gateway. Cơ chế credential nội bộ chưa
    chốt.
servers:
- url: http://service.internal
  description: Placeholder nội bộ; không dùng làm hostname thực tế
tags:
- name: Hotel Internal
- name: Booking Internal
paths:
  /internal/v1/rooms/{room_id}/booking-snapshot:
    get:
      tags:
      - Hotel Internal
      operationId: getRoomBookingSnapshot
      summary: Lấy snapshot phòng cho booking
      responses:
        '200':
          description: Thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RoomSnapshot'
        '401':
          description: Chưa xác thực
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '404':
          description: Không tìm thấy
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '503':
          description: Dịch vụ chưa sẵn sàng
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
      parameters:
      - name: room_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      security:
      - bearerAuth: []
  /internal/v1/availability/check:
    post:
      tags:
      - Booking Internal
      operationId: checkRoomAvailability
      summary: Kiểm tra batch khả dụng (không giữ chỗ)
      responses:
        '200':
          description: Thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AvailabilityResponse'
        '400':
          description: Dữ liệu không hợp lệ
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '401':
          description: Chưa xác thực
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '422':
          description: Vi phạm ràng buộc dữ liệu
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '503':
          description: Dịch vụ chưa sẵn sàng
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AvailabilityRequest'
      security:
      - bearerAuth: []
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Placeholder cho service credential; cần thay bằng cấu hình được duyệt
  schemas:
    RoomSnapshot:
      type: object
      additionalProperties: false
      required:
      - room_id
      - hotel_id
      - active
      - capacity
      - price_per_night_vnd
      properties:
        room_id:
          type: string
          format: uuid
        hotel_id:
          type: string
          format: uuid
        active:
          type: boolean
        capacity:
          type: integer
          minimum: 1
        price_per_night_vnd:
          type: integer
          minimum: 0
    AvailabilityRequest:
      type: object
      additionalProperties: false
      required:
      - room_ids
      - check_in
      - check_out
      properties:
        room_ids:
          type: array
          minItems: 1
          maxItems: 100
          uniqueItems: true
          items:
            type: string
            format: uuid
        check_in:
          type: string
          format: date
        check_out:
          type: string
          format: date
    AvailabilityResponse:
      type: object
      additionalProperties: false
      required:
      - available_room_ids
      properties:
        available_room_ids:
          type: array
          uniqueItems: true
          items:
            type: string
            format: uuid
    Problem:
      type: object
      additionalProperties: false
      required:
      - type
      - title
      - status
      - detail
      - code
      - request_id
      properties:
        type:
          type: string
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        instance:
          type: string
        code:
          type: string
        request_id:
          type: string
